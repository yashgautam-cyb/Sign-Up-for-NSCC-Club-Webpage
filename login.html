<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <span style="color: aliceblue; font-size: 22px; font-weight: 600;">NSCC Club Admin</span>
        <button id="themeToggle" class="header-btn" style="background: transparent; border: 1px solid #fff;">🌙 Dark Mode</button>
    </header>

    <div class="container">
        <h2>Admin Login</h2>
        <form id="loginForm">
            <input type="text" id="loginUsername" placeholder="Username" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <div id="login-msg"></div>
            <button type="submit" class="submit-btn" style="background: #007BFF;">Login</button>
        </form>
    </div>

    <div style="padding: 20px;">Back to <a href="index.html" style="color: inherit;">Sign Up</a></div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginMsg = document.getElementById('login-msg');
        let users = JSON.parse(localStorage.getItem('users')) || [];

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(byte => byte.toString(16).padStart(2, '0')).join('');
        }

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            loginMsg.className = "error";
            
            const loginUser = document.getElementById('loginUsername').value.trim();
            const loginPass = document.getElementById('loginPassword').value;
            const foundUser = users.find(u => u.username === loginUser);

            if (!foundUser) return loginMsg.textContent = "User not found.";

            const hashedInputPassword = await hashPassword(loginPass);
            if (hashedInputPassword !== foundUser.password) return loginMsg.textContent = "Incorrect password.";
            if (foundUser.role !== "Admin") return loginMsg.textContent = "Access Denied: Admin privileges required.";

            sessionStorage.setItem('isAdminLoggedIn', 'true');
            window.location.href = 'dashboard.html'; 
        });

        // Theme Toggle Script
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (themeToggle) {
            themeToggle.textContent = savedTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
            
            themeToggle.addEventListener('click', () => {
                const activeTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = activeTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeToggle.textContent = newTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
            });
        }
    </script>
</body>
</html>
