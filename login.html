<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="page_icon.png">
</head>
<body>
    <header>
        <span style="color: aliceblue; font-size: 22px; font-weight: 600;">NSCC Club Admin</span>
        <button id="themeToggle" class="header-btn" style="background: transparent; border: 1px solid #fff;">🌙 Dark Mode</button>
    </header>

    <div class="container">
        <h2>Admin Login</h2>
        <form id="loginForm">
            <input type="text" id="loginUsername" placeholder="Username" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <div id="login-msg"></div>
            <button type="submit" class="submit-btn" style="background: #007BFF;">Login</button>
        </form>
    </div>

    <div style="padding: 20px;">Back to <a href="index.html" style="color: rgb(30, 64, 234);">Sign Up</a></div>

    <script src="utils.js"></script>
    <script>

        // Initialising theme for page
        initTheme();
        const loginForm = document.getElementById('loginForm');
        const loginMsg = document.getElementById('login-msg');
        let users = JSON.parse(localStorage.getItem('users')) || [];

        //Executes this when form is submitted
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            loginMsg.className = "error";
            
            const loginUser = document.getElementById('loginUsername').value.trim();
            const loginPass = document.getElementById('loginPassword').value;

            //Finding data for entered username
            const foundUser = users.find(u => u.username === loginUser);

            if (!foundUser) return loginMsg.textContent = "User not found.";

            const hashedInputPassword = await hashPassword(loginPass);
            
            //Comparing entered password to password in localStorage
            if (hashedInputPassword !== foundUser.password) return loginMsg.textContent = "Incorrect password.";
            if (foundUser.role !== "Admin") return loginMsg.textContent = "Access Denied: Admin privileges required.";

            //setting status of page to admin logged in for the dashboard to be visible and redirecting to the dashboard page
            sessionStorage.setItem('currentUser', foundUser.username);
            sessionStorage.setItem('isAdminLoggedIn', 'true');
            window.location.href = 'dashboard.html'; 
        });
    </script>
</body>
</html>
