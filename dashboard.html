<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="page_icon.png">
</head>
<body>
    <header>
        <button id="themeToggle" class="header-btn" style="background: transparent; border: 1px solid #fff;">🌙 Dark Mode</button>
        <button id="logoutBtn" class="header-btn" style="background: #d4211e;">Logout</button>
    </header>

    <div class="container" style="max-width: 800px;">
        <h2>Admin Dashboard</h2>
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Delete</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="dashboardBody">
                <!--User rows entered here-->
            </tbody>
        </table>
    </div>

    <script>
        // Security Check: Redirect to login if not authenticated
        if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        const dashboardBody = document.getElementById('dashboardBody');
        const logoutBtn = document.getElementById('logoutBtn');
        let users = JSON.parse(localStorage.getItem('users')) || [];

        //Function to display all the details of the members
        function renderDashboard() {
            dashboardBody.innerHTML = ""; 
            users.forEach((user, index) => {
                const row = document.createElement('tr');
                
                const roleBadge = user.role === "Admin" 
                    ? `<span class="badge badge-admin">Admin</span>` 
                    : `<span class="badge badge-member">Member</span>`;
                
                const actionBtn = user.role === "Member"
                    ? `<button class="icon-btn promote-btn" onclick="promoteUser(${index})" title="Promote to Admin">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg> Promote
                       </button>`
                    : `<button class="icon-btn demote-btn" onclick="demoteUser(${index})" title="Demote to Member">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg> Demote
                       </button>`;

                row.innerHTML = `
                    <td>${user.username}</td>
                    <td>${user.email}</td>
                    <td>${roleBadge}</td>
                    <td>
                        <button class="icon-btn delete-btn" onclick="deleteUser(${index})" title="Delete User">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Delete
                        </button>
                    </td>
                    <td>${actionBtn}</td>
                `;
                dashboardBody.appendChild(row);
            });
        }

        // Delete User
        function deleteUser(index) {
            users.splice(index, 1);
            localStorage.setItem('users', JSON.stringify(users));
            renderDashboard();
        }

        // Promote User
        function promoteUser(index) {
            const userPromote = users.splice(index, 1)[0];
            userPromote.role = "Admin";
            users.push(userPromote);
            localStorage.setItem('users', JSON.stringify(users));
            renderDashboard();
        }

        // Demote User
        function demoteUser(index) {
            const userPromote = users.splice(index, 1)[0];
            userPromote.role = "Member";
            users.push(userPromote);
            localStorage.setItem('users', JSON.stringify(users));
            renderDashboard();
        }

        // Logout
        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('isAdminLoggedIn');
            window.location.href = 'index.html';
        });

        // Theme Toggle Script
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (themeToggle) {
            themeToggle.textContent = savedTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
            
            themeToggle.addEventListener('click', () => {
                const activeTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = activeTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeToggle.textContent = newTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
            });
        }

        // Initial render
        renderDashboard();
    </script>
</body>
</html>
