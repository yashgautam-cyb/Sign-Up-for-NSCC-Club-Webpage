<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="page_icon.png">
</head>
<body>
    <header>
        <button id="themeToggle" class="header-btn" style="background: transparent; border: 1px solid #fff;">🌙 Dark Mode</button>
        <button id="logoutBtn" class="header-btn" style="background: #d4211e;">Logout</button>
    </header>

    <div class="container" style="max-width: 800px;">
        <h2>Admin Dashboard</h2>
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Delete</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="dashboardBody">
                <!--User rows entered here-->
            </tbody>
        </table>
    </div>

    <script src="utils.js"></script>
    <script>

        // Initialising theme for page
        initTheme();

        // Security Check: Redirect to login if not authenticated
        if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }

        const dashboardBody = document.getElementById('dashboardBody');
        const logoutBtn = document.getElementById('logoutBtn');
        let users = JSON.parse(localStorage.getItem('users')) || [];
        const currentUser = sessionStorage.getItem('currentUser');
        const totalAdmins = parseInt(localStorage.getItem('total-admins')) || 0;

        //Function to display all the details of the members
        function renderDashboard() {
            dashboardBody.innerHTML = ""; 
            users.forEach((user, index) => {
                const row = document.createElement('tr');
                
                const roleBadge = user.role === "Admin" 
                    ? `<span class="badge badge-admin">Admin</span>` 
                    : `<span class="badge badge-member">Member</span>`;
                
                let actionBtn;
                let deleteBtn;

                if (user.username === currentUser) {
                    actionBtn = " ";
                    deleteBtn = " ";
                } else if (totalAdmins <= 1 && user.role === "Admin") {
                    actionBtn = " ";
                    deleteBtn = " ";
                } else if (user.role === "Admin") {
                    actionBtn = `<button class="icon-btn demote-btn" onclick="toggleRole(${index})" title="Demote to Member">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg> Demote
                                 </button>`;
                    deleteBtn = `<button class="icon-btn delete-btn" onclick="deleteUser(${index})" title="Delete User">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Delete
                                </button>`;
                } else if (user.role === "Member") {
                    actionBtn = `<button class="icon-btn promote-btn" onclick="toggleRole(${index})" title="Promote to Admin">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg> Promote
                                 </button>`;
                    deleteBtn = `<button class="icon-btn delete-btn" onclick="deleteUser(${index})" title="Delete User">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Delete
                                </button>`;
                }
                /*user.username === currentUser ? actionBtn = " " : actionBtn = totalAdmins <= 1 ? " " : user.role === "Member"
                    ? `<button class="icon-btn promote-btn" onclick="toggleRole(${index})" title="Promote to Admin">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg> Promote
                       </button>`
                    : `<button class="icon-btn demote-btn" onclick="toggleRole(${index})" title="Demote to Member">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg> Demote
                       </button>`;

                user.username === currentUser ? deleteBtn = " " : deleteBtn = totalAdmins <= 1 ? " " : `<button class="icon-btn delete-btn" onclick="deleteUser(${index})" title="Delete User">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Delete
                    </button>`;*/

                row.innerHTML = `
                    <td>${user.username}</td>
                    <td>${user.email}</td>
                    <td>${roleBadge}</td>
                    <td>${deleteBtn}</td>
                    <td>${actionBtn}</td>
                `;
                dashboardBody.appendChild(row);
            });
        }

        // Delete User
        function deleteUser(index) {
            users.splice(index, 1);
            localStorage.setItem('users', JSON.stringify(users));
            renderDashboard();
        }

        // Promote/Demote User
        function toggleRole(index) {
            users[index].role = users[index].role === "Admin" ? "Member" : "Admin";
            localStorage.setItem('users', JSON.stringify(users));
            renderDashboard();
        }

        // Logout
        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('currentUser');
            sessionStorage.removeItem('isAdminLoggedIn');
            window.location.href = 'index.html';
        });

        // Updating the total number of admins in localStorage
        const updatedTotalAdmins = users.filter(u => u.role === "Admin").length;
        localStorage.setItem('total-admins', updatedTotalAdmins);

        // Initial render
        renderDashboard();
    </script>
</body>
</html>
